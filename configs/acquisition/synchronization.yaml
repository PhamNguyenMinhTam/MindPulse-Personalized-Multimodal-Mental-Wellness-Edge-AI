protocol:
	name: MP01
	version: 1
	timestamp_clock: esp_timer_monotonic_us

streams:
	voice:
		sample_rate_hz: 16000
		sample_format: signed_int16_le
		channels: 1
	ppg:
		sample_rate_hz: 100
		supported_sample_rates_hz: [50, 100, 200, 400]
		sample_format: uint32_le_red_ir_pairs
		channels: 2

alignment:
	window_duration_s: 10
	minimum_coverage: 0.95
	resample_modalities: false
